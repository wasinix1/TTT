<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!--META-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/static/style.css">
<style>
/* The public face of the club. Same language as the console — white paper,
   black ink, one red — but where the console packs data tight, this spreads
   a few big flat fields. Red is a surface here, not just a signal. */
body{padding-bottom:0}
.site{max-width:1240px;margin:0 auto;padding:0 0 40px}

/* ------------------------------------------------------------------ hero */
.hero{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:2px;min-height:88vh;padding:0;border-bottom:none;
}
.hero-panel{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  gap:40px;padding:clamp(24px,4vw,52px);border-radius:10px;overflow:hidden;
  background-image:url('/static/poster.jpg');background-size:cover;background-position:center;
}
/* the poster reads through as texture, not as an image you look at */
.hero-panel::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.86)}
.hero-panel > *{position:relative}
.lockup{display:inline-block;line-height:.8;align-self:flex-start}
.lockup .shadow{position:absolute;top:4px;left:5px;color:var(--signal)}
.lockup span{font-size:clamp(64px,11vw,150px);font-weight:800;letter-spacing:-.03em}
.hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}

.kicker{display:flex;align-items:center;gap:10px;color:var(--muted);
        font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.hero h1{font-size:clamp(26px,3.2vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.04;margin:0}

/* date / venue / time as one block, the venue in red */
.facts{display:flex;flex-direction:column;gap:0;
       font-size:clamp(26px,3.2vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.04}
.fact .k{display:none}
.fact .v{font-size:inherit;font-weight:inherit;margin:0}
.fact.venue .v{color:var(--signal)}

.poster{position:relative;background:var(--signal);min-height:320px;overflow:hidden;border-radius:10px}
/* until a real poster.jpg is dropped in, the panel carries a ball instead of
   sitting empty; the image, when it loads, covers this entirely */
.poster::before{content:"";position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;background:#fff;
  box-shadow:0 0 0 clamp(10px,2.4vw,26px) rgba(255,255,255,.14),0 0 0 clamp(22px,5vw,54px) rgba(255,255,255,.07)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.count{margin-top:0;display:flex;align-items:baseline;gap:clamp(28px,5vw,64px);flex-wrap:wrap;
       padding:clamp(22px,3vw,34px) clamp(24px,4vw,52px);background:var(--surface);border-radius:10px}
.count div{text-align:left;min-width:0;display:flex;align-items:baseline;gap:9px}
.count .n{font-size:clamp(30px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1}
.count .l{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}

/* --------------------------------------------------------------- sections */
.section{padding:clamp(28px,4vw,52px) clamp(24px,4vw,52px)}
.section h2{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
            color:var(--muted);margin-bottom:16px}

.cup{border:none;border-radius:10px;padding:clamp(22px,3vw,34px);margin-bottom:2px;
     background:var(--surface);display:flex;gap:16px;align-items:flex-start}
.cup .body{flex:1;min-width:0}
.cup .name{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.03em;line-height:.95}
.cup .meta{color:var(--muted);font-size:17px;font-weight:600;margin-top:8px}
.cup .line{color:var(--muted);font-size:15px;margin-top:8px}
.podium{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.podium div{display:flex;gap:12px;align-items:baseline;font-size:16px}
.podium .pl{color:var(--dim);font-size:13px;font-weight:700;width:22px;flex:none}
.podium .who{font-weight:600}
.podium .rec{color:var(--muted);font-size:14px}
.podium .win .who{color:var(--signal);font-weight:700}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
     padding:6px 9px;border-radius:4px;background:var(--edge);color:var(--muted);white-space:nowrap}
.tag.open{background:var(--signal);color:#fff}

.foot{border-top:none;padding:clamp(20px,3vw,32px) clamp(24px,4vw,52px);
      color:var(--dim);font-size:15px;display:flex;justify-content:space-between;
      gap:20px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--signal);font-weight:500}
.foot a:hover{color:var(--chalk)}
.blank{color:var(--dim)}

/* ------------------------------------------------------------------ form */
.cta{display:inline-block;width:auto;text-align:center;background:var(--signal);color:#fff;
     border:0;border-radius:8px;padding:15px 28px;font-size:16px;font-weight:600;
     margin-top:0;cursor:pointer;text-decoration:none;
     transition:background .09s,transform .09s}
.cta:hover{background:var(--chalk);color:#fff;filter:none}
.cta:active{transform:translateY(2px)}
.cta.block{display:block;width:100%;margin-top:18px}
.cta.ghost{background:var(--chalk);color:#fff;border:none;font-weight:600}
.cta.ghost:hover{background:var(--signal)}

.form-field{margin-top:18px}
.form-field:first-child{margin-top:0}
.form-field label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;
                  text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.form-field input,.form-field select,.form-field textarea{
  width:100%;background:#fff;color:var(--chalk);border:none;
  border-bottom:2px solid transparent;
  border-radius:6px;padding:16px 18px;font-size:17px;font-weight:500;
  transition:border-color .11s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  outline:none;border-bottom-color:var(--signal)}
.form-field textarea{min-height:92px;resize:vertical;line-height:1.45}
.form-field .hint{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.45}
/* the partner block only exists once a doubles cup is chosen */
.form-field.partner input{border-bottom-color:var(--signal)}
.form-field[hidden]{display:none}

.choice{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}
.choice button{flex:1;min-width:150px;background:var(--surface);color:var(--chalk);
               border:none;border-radius:8px;padding:15px 17px;
               font-size:15px;cursor:pointer;text-align:left;font-weight:600}
.choice button:hover{background:var(--edge);color:var(--chalk)}
.choice button.on{background:var(--chalk);color:#fff;border:none}
.choice .t{display:block;font-weight:700;font-size:17px;letter-spacing:-.01em}
.choice .s{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.choice button.on .s{color:rgba(255,255,255,.7)}

.err{color:var(--signal);font-size:15px;font-weight:600;margin-top:14px}
.done-card{border:none;background:var(--surface);border-radius:10px;
           padding:clamp(24px,3.5vw,44px);margin-top:8px}
.done-card h2{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;
              line-height:1;margin-bottom:12px;color:var(--chalk);
              text-transform:none;letter-spacing:-.02em}
.done-card p{color:var(--muted);margin:0 0 6px;font-size:17px}
.back{display:inline-block;margin-top:26px;color:var(--muted);font-size:15px}

/* the cup list, spelled out, in the dark tile beside the form */
.join-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px}
.join-note{background:var(--chalk);color:#fff;border-radius:10px;
           padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;
           justify-content:center;gap:14px;min-height:260px}
.join-note h2{margin:0;font-size:clamp(30px,4.2vw,54px);font-weight:800;
              letter-spacing:-.02em;line-height:1;color:#fff;text-transform:none}
.join-note .cups-list{display:flex;flex-direction:column;gap:7px;text-align:center;
                      font-size:18px;line-height:1.3}
.join-note .cups-list b{font-weight:700;letter-spacing:.02em}
.join-note .cups-list i{font-style:normal;color:var(--signal);font-weight:700}
.join-form{background:var(--surface);border-radius:10px;
           padding:clamp(24px,3.5vw,44px);display:flex;align-items:center}
.join-form > *{width:100%}

@media (max-width:720px){
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero-panel{gap:30px;padding:30px 22px 34px}
  .poster{min-height:230px}
  .join-note{padding:32px 22px;min-height:auto}
  .join-form{padding:24px 22px 28px}
  .section{padding:28px 22px}
  .foot{padding:22px}
}
</style>
</head>
<body>
<div class="site">
  <header class="hero">
    <div class="hero-panel">
      <span class="lockup" aria-hidden="true">
        <span class="shadow">TTT</span><span>TTT</span>
      </span>
      <div class="hero-foot">
        <div>
          <div class="kicker"><span id="kicker">Upcoming</span></div>
          <h1 id="name">…</h1>
          <p class="blurb" id="blurb" hidden></p>
          <div class="facts" id="facts"></div>
        </div>
        <div id="cta-slot"></div>
      </div>
    </div>
    <div class="poster">
      <img src="/static/poster.jpg" alt="" onerror="this.remove()">
    </div>
  </header>

  <div class="count" id="count" hidden></div>

  <section class="section" id="join" hidden></section>

  <section class="section" id="cups-section" hidden>
    <h2 id="cups-head">What's being played</h2>
    <div id="cups"></div>
    <p class="blank" id="cups-note" hidden></p>
  </section>

  <footer class="section foot" id="foot">
    <span id="foot-note"></span>
    <a href="/">Live scores and tables</a>
  </footer>
</div>
<script src="/static/site.js"></script>
</body>
</html>
