<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!--META-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/static/style.css">
<style>
/* The public face of the club. Same language as the console — white paper,
   black ink, one red — but where the console packs data tight, this spreads
   a few big flat fields. Red is a surface here, not just a signal.

   Written against what site.js actually renders: two facts (When / Where,
   both long strings), a countdown, a CTA link to /join, and cup cards. The
   entry form is its own page at /join — not on this one. */

/* site.js toggles the hidden attribute on #blurb #count #join #cups-section
   #cups-note, so nothing below may set display on them unconditionally */
[hidden]{display:none!important}

body{padding-bottom:0}
.site{max-width:none;margin:0;padding:0 clamp(0px,1vw,14px) 40px}

/* ------------------------------------------------------------------ hero */
.hero{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:2px;padding:0;border-bottom:none;
}
.hero-panel{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  gap:clamp(28px,4vw,48px);padding:clamp(24px,4vw,52px);
  border-radius:10px;overflow:hidden;min-height:clamp(420px,58vh,660px);
  background-image:url('/static/texture.jpg');background-size:cover;background-position:center;
}
/* two images: texture.jpg (the balls) sits behind the text as a wash, and
   poster.jpg (the table) fills the panel beside it. if texture.jpg is missing
   the text panel is simply white, which is fine */
.hero-panel::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.86)}
.hero-panel > *{position:relative}
.lockup{display:inline-block;line-height:.8;align-self:flex-start}
.lockup .shadow{position:absolute;top:4px;left:5px;color:var(--signal)}
.lockup span{font-size:clamp(56px,10vw,132px);font-weight:800;letter-spacing:-.03em}

.hero-foot{display:flex;flex-direction:column;gap:clamp(18px,2.4vw,26px)}
.kicker{display:flex;align-items:center;gap:10px;color:var(--signal);
        font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,4.6vw,58px);font-weight:800;letter-spacing:-.03em;
         line-height:1.02;margin:0;max-width:20ch;text-wrap:pretty}
.blurb{color:var(--muted);font-size:17px;font-weight:400;line-height:1.5;
       margin:0;max-width:52ch}

/* The agreed look: date and venue as one display-scale stack, venue in red,
   labels hidden — at this size "When" over a date is noise. site.js formats
   When as a long string ("Thursday, 24 September, 19:00"), so the line-height
   is set tight for a value that may wrap to two lines. */
.facts{display:flex;flex-direction:column;gap:0;margin:0}
.fact .k{display:none}
.fact .v{font-size:clamp(24px,3vw,40px);font-weight:800;letter-spacing:-.03em;
         line-height:1.06;max-width:22ch;text-wrap:pretty}
.fact.venue .v{color:var(--signal);text-transform:uppercase}

.poster{position:relative;background:var(--signal);min-height:320px;overflow:hidden;border-radius:10px}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  /* which part of the photo stays in frame: x% y%. 50% 50% is the middle;
     raise y to show more of the bottom, lower it to show more of the top */
  object-position:var(--poster-pos,50% 50%)}

/* the countdown, one quiet strip */
.count{margin:2px 0 0;display:flex;align-items:baseline;gap:clamp(28px,5vw,64px);
       flex-wrap:wrap;padding:clamp(22px,3vw,34px) clamp(24px,4vw,52px);
       background:var(--surface);border-radius:10px}
.count div{text-align:left;min-width:0;display:flex;align-items:baseline;gap:9px}
.count .n{font-size:clamp(30px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1}
.count .l{font-size:12px;font-weight:600;letter-spacing:.12em;
          text-transform:uppercase;color:var(--muted);margin:0}

/* --------------------------------------------------------------- sections */
.section{padding:clamp(28px,4vw,52px) clamp(24px,4vw,52px)}
/* the small uppercase label is for the cups heading only — #join's h2 is a
   real page heading and must not be shrunk to a label */
#cups-head{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
           color:var(--muted);margin-bottom:16px}

.cup{border:none;border-radius:10px;padding:clamp(22px,3vw,34px);margin-bottom:2px;
     background:var(--surface);display:flex;gap:16px;align-items:flex-start}
.cup .body{flex:1;min-width:0}
.cup .name{font-size:clamp(24px,2.8vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1}
.cup .meta{color:var(--chalk);font-size:17px;font-weight:600;margin-top:10px}
.cup .line{color:var(--muted);font-size:15px;font-weight:400;line-height:1.5;margin-top:8px}
.podium{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.podium div{display:flex;gap:12px;align-items:baseline;font-size:16px}
.podium .pl{color:var(--muted);font-size:13px;font-weight:700;width:26px;flex:none}
.podium .who{font-weight:600}
.podium .rec{color:var(--muted);font-size:14px}
.podium .win .who{color:var(--signal);font-weight:700}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
     padding:6px 9px;border-radius:4px;background:var(--edge);color:var(--muted);white-space:nowrap}
.tag.open{background:var(--signal);color:#fff}

.foot{border-top:none;padding:clamp(20px,3vw,32px) clamp(24px,4vw,52px);
      color:var(--muted);font-size:15px;display:flex;justify-content:space-between;
      gap:20px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--signal);font-weight:500}
.foot a:hover{color:var(--chalk)}
.blank{color:var(--muted);font-size:17px;line-height:1.5}

/* ------------------------------------------------- the form, at /join
   site.js renders #join as a single column: h2, .form-field blocks, a .cta
   and a .back link. It is its own page, so it gets a page heading. */
#join{max-width:none;padding-left:0;padding-right:0}
#join > h2{font-size:clamp(30px,4.2vw,50px);font-weight:800;letter-spacing:-.02em;
           line-height:1;margin:0 0 clamp(20px,3vw,28px);text-transform:none;color:var(--chalk)}

.cta{display:inline-block;text-align:center;background:var(--chalk);color:#fff;
     border:0;border-radius:8px;padding:15px 28px;font-size:16px;font-weight:600;
     cursor:pointer;text-decoration:none;
     transition:background .09s,transform .09s}
.cta:hover{background:var(--signal);color:#fff;filter:none}
.cta:active{transform:translateY(2px)}
.cta.ghost{background:var(--surface);color:var(--chalk);border:none;font-weight:600}
.cta.ghost:hover{background:var(--edge)}
#join .cta{margin-top:22px}

.form-field{margin-top:18px}
.form-field:first-of-type{margin-top:0}
.form-field label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;
                  text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.form-field input,.form-field select,.form-field textarea{
  width:100%;background:var(--surface);color:var(--chalk);border:none;
  border-bottom:2px solid transparent;
  border-radius:6px;padding:16px 18px;font-size:17px;font-weight:500;
  transition:border-color .11s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  outline:none;border-bottom-color:var(--signal)}
.form-field textarea{min-height:92px;resize:vertical;line-height:1.45}
.form-field .hint{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.45}
/* the partner and team fields only exist when a pair cup is chosen — site.js
   already decides that; this just marks them as belonging together */
#j-pname,#j-pstr,#j-team{border-bottom-color:var(--signal)}

.choice{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}
.choice button{flex:1;min-width:150px;background:var(--surface);color:var(--chalk);
               border:none;border-radius:8px;padding:15px 17px;
               font-size:15px;cursor:pointer;text-align:left;font-weight:600}
.choice button:hover{background:var(--edge)}
.choice button.on{background:var(--chalk);color:#fff}
.choice .t{display:block;font-weight:700;font-size:17px;letter-spacing:-.01em}
.choice .s{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.choice button.on .s{color:rgba(255,255,255,.75)}

.err{color:var(--signal);font-size:15px;font-weight:600;margin-top:14px}
.done-card{border:none;background:var(--surface);border-radius:10px;
           padding:clamp(24px,3.5vw,44px);margin-top:0}
.done-card h2{font-size:clamp(26px,3vw,36px);font-weight:800;letter-spacing:-.02em;
              line-height:1;margin:0 0 12px;text-transform:none;color:var(--chalk)}
.done-card p{color:var(--muted);margin:0 0 6px;font-size:17px;line-height:1.5}
.back{display:inline-block;margin-top:26px;color:var(--muted);font-size:15px}
.back:hover{color:var(--signal)}

/* the dark tile beside the form: the cups named, then the fields */
.join-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px}
.join-note{background:var(--chalk);color:#fff;border-radius:10px;
           padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;
           justify-content:center;gap:16px;min-height:280px}
.join-note h2{margin:0;font-size:clamp(30px,3.7vw,64px);font-weight:800;
              letter-spacing:-.02em;line-height:1;color:#fff;text-transform:none}
.join-note .cups-list{display:flex;flex-direction:column;gap:6px;font-size:18px;line-height:1.3;
                      color:rgba(255,255,255,.75)}
.join-note .cups-list b{color:#fff;font-weight:700;letter-spacing:.02em}
.join-form{background:var(--surface);border-radius:10px;padding:clamp(24px,3.5vw,44px);
           display:flex;align-items:center}
.join-form > .jf{width:100%}
.join-form .form-field input,.join-form .form-field select,.join-form .form-field textarea{background:var(--raised)}
#join .cta{margin-top:22px}
.join-form .choice button{background:var(--raised)}
.join-form .choice button:hover{background:var(--edge)}
.join-form .choice button.on{background:var(--chalk)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .hero-panel{gap:28px;padding:30px 22px 34px;min-height:0}
  .lockup span{font-size:clamp(56px,17vw,96px)}
  /* edge to edge on a phone — a 10px radius on a full-width block just
     reads as a mistake */
  .poster{min-height:230px;border-radius:0}
  .count{border-radius:0}
  .section{padding:28px 22px}
  .foot{padding:22px}
  .cta{display:block;width:100%}
  .fact .v{font-size:clamp(24px,7vw,32px)}
}

/* ==========================================================================
   The landing as designed (TTT Landing.dc.html / TTT Landing Mobile.dc.html).
   Full bleed, white, 2px seams. While entries are open the hero is only the
   lockup, the date stack and one button; the name, blurb and countdown come
   back once the event is announced-only, running or over. */
.site{max-width:none;margin:0;padding:0}
.hero{min-height:88vh;gap:2px}
.hero-panel{gap:40px}
.hero-foot{flex-direction:row;align-items:flex-end;justify-content:space-between;
           flex-wrap:wrap;gap:24px}
.hero-text{display:flex;flex-direction:column;gap:clamp(14px,2vw,22px);min-width:0}
.facts{font-size:clamp(26px,3.2vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.04}
.fact .v{font-size:inherit;font-weight:inherit;line-height:inherit;max-width:none;text-wrap:balance}
body.pre .kicker,body.pre .hero h1,body.pre .blurb,body.pre .count,body.pre #foot-note{display:none}
#cta-slot .cta{flex:none;margin:0}

#join{padding:0;margin-top:2px}
.join-grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px}
.join-note{min-height:260px;gap:14px}
.join-note h2{font-size:clamp(30px,4.2vw,54px)}
.join-note .cups-list{gap:7px;text-align:center;color:#fff}
.join-note .cups-list b{letter-spacing:.02em}
.join-note .cups-list i{font-style:normal;color:var(--signal);font-weight:700}
.join-form{background:#f6f6f4}
.jform{display:flex;flex-direction:column;gap:2px;width:100%}
.jform input,.jform textarea,.jform select{
  width:100%;font:inherit;font-size:17px;font-weight:500;padding:16px 18px;
  background:#fff;color:var(--chalk);border:none;border-bottom:2px solid transparent;
  border-radius:6px;outline:none;transition:border-color .11s}
.jform input:focus,.jform textarea:focus,.jform select:focus{border-bottom-color:var(--signal)}
.jform input.partner{border-bottom-color:var(--signal)}
.jform textarea{min-height:64px;resize:vertical;line-height:1.45}
.jform ::placeholder{color:var(--muted)}
.selectwrap{position:relative;display:flex}
.selectwrap select{appearance:none;-webkit-appearance:none;padding-right:42px;cursor:pointer}
.selectwrap::after{content:"";position:absolute;right:18px;top:50%;transform:translateY(-50%);
  width:11px;height:7px;background:var(--chalk);clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:none}
.jform .choice{margin:0;gap:2px}
.jform .choice button{background:#fff;padding:13px 16px}
.jform .choice button:hover{background:var(--edge)}
.jform .choice button.on{background:var(--chalk);color:#fff}
.jform .cta.send{align-self:flex-start;margin-top:18px;background:var(--signal)}
.jform .cta.send:hover{background:var(--chalk)}
.jform .back{margin-top:16px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

.foot{padding:clamp(20px,3vw,32px) clamp(24px,4vw,52px)}
.foot .brand{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--muted)}

@media (max-width:720px){
  .hero{min-height:0}
  .hero-panel{gap:30px}
  .hero-foot{flex-direction:column;align-items:stretch;gap:22px}
  .facts{font-size:34px}
  #cta-slot .cta{display:block;width:100%}
  .join-note h2{font-size:32px}
  .join-note{min-height:0;padding:32px 22px}
  .join-form{padding:24px 22px 28px}
  .jform .cta.send{align-self:stretch;width:100%}
  /* one edge-to-edge column: no corners, so no white wedges between the blocks */
  .hero-panel,.poster,.join-note,.join-form,.count,.cup{border-radius:0}
  .hero-foot > *,#cta-slot{width:100%}
  .poster{--poster-pos:var(--poster-pos-m,50% 50%)}
}
</style>
</head>
<body>
<div class="site">
  <header class="hero">
    <div class="hero-panel">
      <span class="lockup" aria-hidden="true">
        <span class="shadow">TTT</span><span>TTT</span>
      </span>
      <div class="hero-foot">
        <div class="hero-text">
          <div class="kicker"><span id="kicker">Demnächst</span></div>
          <h1 id="name">…</h1>
          <p class="blurb" id="blurb" hidden></p>
          <div class="facts" id="facts"></div>
        </div>
        <div id="cta-slot"></div>
      </div>
    </div>
    <div class="poster">
      <img src="/static/poster.jpg" alt="" onerror="this.remove()">
    </div>
  </header>

  <div class="count" id="count" hidden></div>

  <section class="section" id="join" hidden></section>

  <section class="section" id="cups-section" hidden>
    <h2 id="cups-head">Was gespielt wird</h2>
    <div id="cups"></div>
    <p class="blank" id="cups-note" hidden></p>
  </section>

  <footer class="section foot" id="foot">
    <span class="brand">TTT</span>
    <span id="foot-note"></span>
    <a href="/">Live-Ergebnisse</a>
  </footer>
</div>
<script src="/static/site.js"></script>
</body>
</html>
