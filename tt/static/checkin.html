<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Einchecken</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<style>
/* Self check-in: the page behind the QR code on the hall wall. One column,
   big targets, the public site's language — white paper, black ink, red. */
[hidden]{display:none!important}
body{padding-bottom:40px}
.ci{max-width:520px;margin:0 auto;padding:clamp(20px,5vw,40px) 16px}
.kicker{color:var(--signal);font-size:13px;font-weight:700;letter-spacing:.1em;
        text-transform:uppercase;margin:0 0 6px}
h1{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0 0 24px}
h2{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
   color:var(--muted);margin:30px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.block{background:var(--surface);border-radius:var(--r);padding:18px}
.cta{display:block;width:100%;text-align:center;background:var(--chalk);color:#fff;border:none;
     border-radius:var(--r);padding:16px 18px;font-size:17px;font-weight:700;cursor:pointer;
     margin-top:10px;text-decoration:none}
.cta:hover{background:var(--signal);color:#fff}
.cta:disabled{opacity:.5;cursor:default}
.cta.ghost{background:var(--surface);color:var(--chalk);font-weight:600}
.cta.ghost:hover{background:var(--edge)}
.cta.tg{background:#229ed9}
.cta .s{display:block;font-size:13px;font-weight:500;opacity:.75;margin-top:2px}
input,select{display:block;width:100%;border:none;border-radius:var(--r-sm);background:var(--raised);
     color:var(--chalk);padding:14px;font-size:17px;margin-top:8px;outline:2px solid transparent}
.block input,.block select{background:var(--ground)}
input:focus,select:focus{outline-color:var(--chalk)}
.found{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.found button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-align:left;
     border:none;border-radius:var(--r-sm);background:var(--ground);color:var(--chalk);
     padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.found button:hover{background:var(--chalk);color:#fff}
.found button small{font-weight:500;color:inherit;opacity:.7;font-size:13px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.choice button{border:none;border-radius:var(--r-sm);background:var(--ground);color:var(--chalk);
     padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.choice button.on{background:var(--chalk);color:#fff}
.err{color:var(--signal);font-weight:600;margin-top:12px}
.done{border-left:6px solid var(--signal);padding:4px 0 4px 16px;margin-bottom:18px}
.done .who{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.back{display:inline-block;margin-top:22px}
.here{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin:0 0 8px}
</style>
</head>
<body>
<main class="ci" id="app"><p class="muted">Einen Moment …</p></main>
<script src="/static/checkin.js"></script>
</body>
</html>
