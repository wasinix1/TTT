<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/static/style.css">
<style>
/* Sized for a room, not a hand: everything here has to be readable from the
   far side of a hall, so there is no chrome, no controls and no scrolling.
   A live table is a red block — that is the one thing people look for. */
body{overflow:hidden;padding-bottom:0}
.screen{padding:2.4vh 2.4vw;height:100vh;display:flex;flex-direction:column;gap:1.8vh}
.screen h1{font-size:3.4vh;font-weight:700;letter-spacing:-.03em;margin:0}
.screen .sub{font-size:2vh;font-weight:600;color:var(--muted);margin:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:2vw}
/* the wordmark, matching the landing page */
.head .mark{
  width:auto;height:auto;border-radius:0;background:none;
  font-size:3.6vh;font-weight:800;letter-spacing:-.05em;color:var(--signal);
}
.head-left{display:flex;align-items:baseline;gap:1.6vw}

.cups{display:flex;gap:2px;flex:1;min-height:0}
.cup{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
     border:none;border-radius:10px;overflow:hidden;background:var(--surface)}
.cup h2{
  font-size:2.7vh;font-weight:800;letter-spacing:-.03em;margin:0;
  padding:1.7vh 1.3vw;border-bottom:none;
  display:flex;align-items:baseline;justify-content:space-between;gap:1vw;
}
.cup h2 span{
  float:none;font-size:1.7vh;color:var(--muted);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
}
.live{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:2px;padding:0 1.3vw 1.3vh;border-bottom:none}
.live:empty{display:none}
/* the match happening right now */
.now{background:var(--signal);border-radius:8px;padding:1.3vh 1.1vw;min-width:0}
.now .t{
  font-size:1.6vh;color:rgba(255,255,255,.82);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
}
.now .p{
  font-size:2.4vh;font-weight:700;letter-spacing:-.02em;color:#fff;margin-top:.4vh;
  line-height:1.18;overflow-wrap:anywhere;text-wrap:pretty;
}

.list{flex:1;overflow:hidden;padding:.6vh 0}
.q{display:flex;align-items:baseline;gap:1vw;padding:1.15vh 1.3vw;font-size:2.1vh;
   border-bottom:1px solid var(--hair)}
.q .n{color:var(--muted);font-size:1.8vh;font-weight:700;width:1.6em;flex:none}
.q .w{
  flex:1;min-width:0;font-weight:500;letter-spacing:-.015em;line-height:1.2;
  overflow-wrap:anywhere;text-wrap:pretty;
}
.q .e{font-size:1.7vh;font-weight:600;color:var(--muted);flex:none}
.q.ondeck{background:var(--signal-wash)}
.q.ondeck .n{color:var(--signal)}
.q.ondeck .w{font-weight:700}
.q.ondeck .e.when{
  color:#fff;background:var(--signal);border-radius:5px;
  padding:.4vh .8vw;font-weight:700;
}
.foot{display:flex;justify-content:space-between;gap:2vw;font-size:1.7vh;font-weight:500;color:var(--muted)}

/* A portrait screen — a spare monitor turned on its side, or a phone held up
   at the door. The columns stack, so each cup owns a third of the height and
   type switches to vmin to stay legible. The footer goes: it is the least
   useful line on the smallest screen. */
@media (orientation:portrait){
  .screen{padding:2.4vmin 2.4vw;gap:1.8vmin}
  .screen h1{font-size:3.4vmin}
  .screen .sub{font-size:2vmin}
  .head .mark{font-size:3.6vmin}
  .cups{flex-direction:column}
  .cup h2{font-size:2.7vmin;padding:1.7vmin 1.3vw}
  .cup h2 span{font-size:1.7vmin}
  .live{padding:0 1.3vw 1.3vmin}
  .now{padding:1.3vmin 1.1vw}
  .now .t{font-size:1.6vmin}
  .now .p{font-size:2.4vmin;margin-top:.4vmin}
  .q{padding:1.15vmin 1.3vw;font-size:2.1vmin}
  .q .n{font-size:1.8vmin}
  .q .e{font-size:1.7vmin}
  .q.ondeck .e.when{padding:.4vmin .8vw}
  .foot{display:none}
}
/* A dark hall. Same layout, inverted ground — the red is unchanged, because
   it is the one thing that has to mean the same in both. */
/* Bright by default. The TTT mark in the corner is a hidden switch to the dark
   hall look (remembered on this screen); ?dark and ?light also work. */
:root.dark{
    --ground:#0a0a0a;
    --surface:#161616;
    --raised:#222222;
    --edge:#2a2a2a;
    --hair:rgba(255,255,255,.09);
    --chalk:#f4f4f2;
    --muted:#b4b4ae;   /* 7.4:1 on the dark ground */
    --dim:#8e8e88;
    --signal-wash:rgba(216,36,26,.16);
  }

/* the mark doubles as the theme switch, and looks like nothing but a logo */
button.mark{background:none;border:none;padding:0;margin:0;cursor:default;font:inherit}
button.mark:hover{background:none}
button.mark:focus-visible{outline:2px solid var(--signal);outline-offset:4px}
</style>
<script>
/* dark is opt-in: ?dark, ?light, or a tap on the mark (remembered) */
(function(){var d=null,q=location.search;
  try{d=localStorage.getItem('tt-board-dark')}catch(e){}
  if(/[?&]dark\b/.test(q))d='1'; if(/[?&]light\b/.test(q))d='0';
  if(d==='1')document.documentElement.classList.add('dark');
  addEventListener('DOMContentLoaded',function(){
    document.getElementById('theme-toggle').addEventListener('click',function(){
      var on=document.documentElement.classList.toggle('dark');
      try{localStorage.setItem('tt-board-dark',on?'1':'0')}catch(e){}
    });
  });
})();
</script>
</head>
<body>
<div class="screen">
  <div class="head">
    <div class="head-left">
      <button class="mark" id="theme-toggle" type="button" aria-label="Switch between bright and dark">TTT</button>
      <h1 id="title">Coming up</h1>
    </div>
    <p class="sub" id="sub"></p>
  </div>
  <div class="cups" id="cups"></div>
  <div class="foot">
    <span id="note"></span>
    <span>Times are estimates — they move as the evening does</span>
  </div>
</div>
<script src="/static/board.js"></script>
</body>
</html>
