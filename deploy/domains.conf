# The one place the app's web address is set. Edit this, then run
#   deploy/update.sh root@your-server
# and the server's Caddyfile is rebuilt from it (checked before it goes live).
# Every name here needs a DNS A record pointing at the server first.

# The address you print on posters and hand to people.
PRIMARY="funk.tttool.org"

# Older names that should keep serving the app unchanged (space-separated).
# Use while posters with the old address are still out there.
ALIASES="yppi.tttool.org"

# Older names that should forward to PRIMARY, keeping the path (so referee and
# admin key links survive). Move a name here once you no longer want it served.
REDIRECTS=""
